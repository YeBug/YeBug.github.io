const form=document.getElementById('unlockForm'),input=document.getElementById('password'),button=document.getElementById('unlockButton'),status=document.getElementById('status');
let busy=false,videoUrl;
const decode=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(packet,key){return crypto.subtle.decrypt({name:'AES-GCM',iv:packet.slice(0,12),tagLength:128},key,packet.slice(12))}
form.addEventListener('submit',async event=>{
  event.preventDefault();if(busy)return;
  if(!crypto.subtle){status.textContent='请使用 HTTPS 地址或本机预览打开。';return}
  busy=true;button.disabled=true;status.textContent='正在打开这封信…';input.setAttribute('aria-invalid','false');
  const password=input.value;input.value='';let phase='password';
  try{
    const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:decode(settings.salt),iterations:settings.iterations},material,{name:'AES-GCM',length:256},false,['decrypt']);
    let html=new TextDecoder().decode(await decrypt(decode(settings.page),key));
    phase='video';status.textContent='正在准备背景视频…';
    let received=0;
    const parts=await Promise.all(Array.from({length:17},async(_,index)=>{
      const name='media-'+String(index+1).padStart(2,'0')+'.bin';
      const response=await fetch(new URL(name,location.href),{cache:'no-store'});
      if(!response.ok)throw new Error('Media download failed: '+response.status);
      const part=new Uint8Array(await response.arrayBuffer());received+=part.length;
      status.textContent='正在准备背景视频… '+Math.round(received/8538225*100)+'%';return part;
    }));
    const packet=new Uint8Array(received);let offset=0;for(const part of parts){packet.set(part,offset);offset+=part.length}
    const video=await decrypt(packet,key);
    videoUrl=URL.createObjectURL(new Blob([video],{type:'video/mp4'}));
    html=html.replace('__VIDEO_URL__',videoUrl);
    const frame=document.createElement('iframe');frame.title='写给你的信';frame.setAttribute('allow','autoplay; fullscreen');frame.setAttribute('allowfullscreen','');frame.srcdoc=html;
    frame.addEventListener('load',()=>{document.getElementById('gate').hidden=true;frame.focus()},{once:true});
    document.body.appendChild(frame);
  }catch(error){
    if(videoUrl){URL.revokeObjectURL(videoUrl);videoUrl=undefined}
    if(phase==='password'){status.textContent='密语不对，再试一次吧。';input.setAttribute('aria-invalid','true')}
    else status.textContent='视频暂时未能加载，请重新输入密语再试。';
    button.disabled=false;busy=false;input.focus();
  }
});
window.addEventListener('pagehide',()=>{if(videoUrl)URL.revokeObjectURL(videoUrl)});
</script>
